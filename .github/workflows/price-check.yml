# Manual price check. There is intentionally no schedule: run it from the
# Actions tab ("Run workflow") when you want a fresh reading.
name: Price check

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending WhatsApp messages"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[whatsapp]"

      # Caches are immutable, so each run saves under a new key and the next
      # run restores the most recent one via the prefix.
      - name: Restore price history
        uses: actions/cache@v4
        with:
          path: data/price_history.csv
          key: price-history-${{ github.run_id }}
          restore-keys: price-history-

      - name: Check prices
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python -m price_tracker check ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Build report
        if: always() && hashFiles('data/price_history.csv') != ''
        run: python -m price_tracker report --history data/price_history.csv --output report/price-history.png --html report/index.html

      - name: Upload report
        if: always() && hashFiles('report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: price-report
          path: report/
